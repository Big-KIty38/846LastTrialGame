<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Последний раунд — 3D-игра</title><link rel="stylesheet" href="style.css"></head><body>
<div id="viewport"></div><div class="vignette"></div><div id="bootError"></div>
<div id="hud" class="hidden"><header><div class="brand">ПОСЛЕДНИЙ <em>РАУНД</em></div><div class="stage"><b id="day">ДЕНЬ 1 / 6</b><span id="round">ОБЩЕЖИТИЕ</span></div><button id="pauseButton">Ⅱ <span>Меню</span></button></header>
<aside id="objective"><div class="eyebrow">ЦЕЛЬ</div><h2 id="objectiveTitle"></h2><p id="objectiveText"></p><div id="special"></div></aside>
<div id="statusChip"></div><div id="crosshair">+</div><div id="prompt"></div>
<div id="vitals"><div><label>Здоровье <b id="hpNum">100</b></label><div class="bar"><i id="hpBar"></i></div></div><div><label>Силы <b id="energyNum">100</b></label><div class="bar energy"><i id="energyBar"></i></div></div><div><label>Сытость <b id="hungerNum">85</b></label><div class="bar hunger"><i id="hungerBar"></i></div></div></div>
<div id="inventory"></div>
<div id="touchUI" class="hidden">
  <div id="joyZone"><div id="joyBase"><div id="joyKnob"></div></div></div>
  <div id="touchRight">
    <button id="btnAct" class="tbtn act">E</button>
    <button id="btnJump" class="tbtn">Прыжок</button>
    <button id="btnCrouch" class="tbtn">Упор / C</button>
    <button id="btnSkill" class="tbtn">Q</button>
    <button id="btnExtra" class="tbtn hidden">Удар</button>
  </div>
</div>
</div>
<div id="toast"></div>
<div id="modal" class="open"><section class="dialog"><div id="modalTag" class="eyebrow"></div><h1 id="modalTitle"></h1><div id="modalBody"></div><div id="modalButtons"></div></section></div>
<div id="carvePanel"><section><div class="eyebrow">ИСПЫТАНИЕ 02</div><h2 id="carveName">Круг</h2><canvas id="carveCanvas" width="540" height="540"></canvas></section><aside><h2>Веди иглу по линии</h2><div id="carveStats"></div><button id="soften" class="primary">Смягчить сахар · 1 вода</button><button id="carvePause">Пауза</button></aside></div>
<script src="vendor/three.min.js"></script><script>if(!window.THREE){document.getElementById('bootError').style.display='block';document.getElementById('bootError').textContent='Не найден локальный движок. Открой ИГРАТЬ.html или распакуй весь архив.';}</script><script src="game.js"></script></body></html>
